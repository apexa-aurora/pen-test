<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Onboarding Portal — Log in</title>
<style>
  :root{
    --teal-bg: #0c3f5e;
    --teal-bg-2: #0a3652;
    --teal-dark: #0a4a68;
    --yellow: #ffcb05;
    --text-dark: #1a1a1a;
    --text-muted: #8a8f98;
    --border: #e2e5e9;
    --btn: #0e4a6b;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background-color: var(--teal-bg);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 46px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 46px);
    padding: 24px;
  }

  .card{
    background:#ffffff;
    width:100%;
    max-width:480px;
    border-radius:14px;
    padding: 40px 44px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    text-align:center;
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom: 18px;
  }

  .brand-icon{
    width:56px;
    height:56px;
    border-radius:12px;
    background: var(--teal-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .brand-icon svg{ width:32px; height:32px; }

  .brand-text{ text-align:left; line-height:1.1; }
  .brand-text .momo{
    font-size:24px;
    font-weight:800;
    color: var(--teal-dark);
    letter-spacing:-0.5px;
  }
  .brand-text .from{
    font-size:12px;
    color: var(--yellow);
    font-weight:700;
    margin-top:2px;
  }

  .portal-title{
    font-size:15px;
    font-weight:700;
    color: var(--text-dark);
    margin: 0 0 28px;
  }

  h1.login-title{
    font-size:28px;
    font-weight:800;
    color: var(--text-dark);
    margin: 0 0 28px;
  }

  .field{
    position:relative;
    margin-bottom:16px;
  }

  .field input{
    width:100%;
    padding: 15px 16px;
    border: 1px solid var(--border);
    border-radius:10px;
    font-size:15px;
    color: var(--text-dark);
    outline:none;
    transition: border-color .15s ease;
  }

  .field input::placeholder{ color:#a9adb4; }

  .field input:focus{
    border-color: var(--teal-dark);
  }

  .field .toggle-visibility{
    position:absolute;
    right:14px;
    top:50%;
    transform: translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    color:#9a9ea5;
    padding:4px;
    display:flex;
  }

  .login-btn{
    width:100%;
    padding:16px;
    margin-top:12px;
    border:none;
    border-radius:10px;
    background: var(--btn);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition: background .15s ease;
  }

  .login-btn:hover{ background:#0b3c58; }

  .links-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
    font-size:14px;
    color: var(--text-muted);
  }

  .links-row a{
    color: var(--text-dark);
    font-weight:700;
    text-decoration:none;
  }

  .links-row .forgot{
    color: var(--text-muted);
    font-weight:400;
  }
  .links-row .forgot:hover{ text-decoration:underline; }

  @media (max-width:520px){
    .card{ padding: 32px 24px 26px; }
    .links-row{ flex-direction:column; gap:10px; text-align:center; }
  }
</style>
</head>
<body>

  <form class="card" id="loginForm" method="POST" novalidate>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 4 L24 26 L16 20 L8 26 Z" fill="#ffcb05"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="momo">MoMo</div>
        <div class="from">from MTN</div>
      </div>
    </div>

    <p class="portal-title">Smart Onboarding Portal</p>

    <h1 class="login-title">Log in</h1>

    <div class="field">
      <input type="text" id="identifier" name="identifier" placeholder="Email or Phone number" autocomplete="username" required>
    </div>

    <div class="field">
      <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <button type="button" class="toggle-visibility" id="togglePassword" aria-label="Show password">
        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <input type="submit" class="login-btn">Log in</button>

    <div class="links-row">
      <span>Don't have an account? <a href="#">Sign up</a></span>
      <a class="forgot" href="#">Forgot password?</a>
    </div>
  </form>

<script>
  const pwd = document.getElementById('password');
  const toggle = document.getElementById('togglePassword');
  const eyeIcon = document.getElementById('eyeIcon');

  toggle.addEventListener('click', () => {
    const showing = pwd.type === 'text';
    pwd.type = showing ? 'password' : 'text';
    toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    eyeIcon.innerHTML = showing
      ? '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 4.2A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C4 8.3 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4.2-.9"/>';
  });

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    // TODO: wire this up to your PHP auth endpoint (e.g. login.php)
    console.log('Login submitted:', {
      identifier: document.getElementById('identifier').value,
      password: pwd.value
    });
  });
</script>

</body>
</html>
