```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexa Aurora - Security Lab</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f0d;
            font-family: Arial, sans-serif;
            color: white;
        }

        .login-box {
            width: 360px;
            padding: 35px;
            background: #121815;
            border: 1px solid #26352c;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #8c9a91;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 7px;
            border: 1px solid #35463b;
            background: #080b09;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #5aa46c;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #315f3e;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3c754c;
        }

        #result {
            display: none;
            margin-top: 20px;
            padding: 12px;
            border-radius: 7px;
            background: #1d3524;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h1>Security Lab</h1>
    <p class="subtitle">Authorized Penetration Testing Environment</p>

    <form id="loginForm">
        <label>Username</label>
        <input
            type="text"
            id="username"
            autocomplete="off"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            autocomplete="off"
            required
        >

        <button type="submit">Sign In</button>
    </form>

    <div id="result">
        Test submission received. No credentials were transmitted or stored.
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // Deliberately do NOT send the username or password anywhere.
    document.getElementById("result").style.display = "block";

    this.reset();
});
</script>

</body>
</html>
